name: Update index & deploy

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h at :17 to dodge the top-of-hour queue
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "public/data/**"
      - "data/**"
      - "README.md"

# Least privilege: nothing by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: gci-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit refreshed JSON
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch live data & compute index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/update_index.py

      - name: Unit tests (scoring + data integrity) — gate before commit
        run: python -m pytest -q tests

      - name: Commit refreshed state
        run: |
          git config user.name  "gci-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest_state.json public/data/history.json data/state_cache.json
          if git diff --cached --quiet; then
            echo "No data change"
            exit 0
          fi
          git commit -m "data: update index $(date -u +'%Y-%m-%dT%H:%MZ')"
          # Retry on a race with another push, but never swallow a real failure.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push refreshed data"
          exit 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-checkout the branch tip so the build includes the data just committed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
